[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppfe"
version = "0.1.0"
description = "A9_PPFE: host a geospatial foundation model for fast HRRR downscaling + flood decision support"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tim Mayer", email = "tjm0042@uah.edu" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
  "onnxruntime>=1.17",   # swap for onnxruntime-gpu (CUDA) or onnxruntime-directml (Windows GPU)
  "httpx>=0.26",
  "networkx>=3.2",
  "reportlab>=4.0",
  "PyJWT>=2.8",
]

[project.optional-dependencies]
hrrr = ["herbie-data>=2024.3", "xarray>=2024.1", "cfgrib>=0.9.10", "netCDF4"]
export = ["torch>=2.2", "onnx>=1.15"]          # only to (re)export the placeholder / your model to ONNX
geo = ["rasterio>=1.3"]                         # GeoTIFF/COG outputs alongside PNG overlays
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
ppfe = "ppfe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs network / real services (deselect with -m 'not integration')"]
addopts = "-q"

[tool.ruff]
line-length = 130
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B904"]
