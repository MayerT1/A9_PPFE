<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A9 PPFE Fact Sheet</title>
  <meta name="description" content="What the A9 PPFE flood decision-support portal does, how it works, data sources, limits and version history." />
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <style>
    body { background: var(--bg); overflow: auto; height: auto; }
    header.bar { position: sticky; top: 0; z-index: 2; }
    header.bar a { color: var(--bar-ink); text-decoration: none; }
    article { max-width: 860px; margin: 24px auto 64px; background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 28px 36px; line-height: 1.6; font-size: 14px; }
    article h1 { font-size: 24px; margin: 0 0 6px; line-height: 1.25; }
    article h2 { font-size: 16px; color: var(--accent); margin: 28px 0 8px; padding-top: 8px; border-top: 1px solid var(--rule); }
    article table { border-collapse: collapse; width: 100%; margin: 8px 0 4px; font-size: 13px; }
    article th, article td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    article th { border-bottom: 1.5px solid var(--ink); }
    article thead:empty, article th:empty { display: none; }
    article code { background: #f1f4f7; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
    article blockquote { margin: 10px 0; padding: 8px 14px; background: var(--accent-soft); border-radius: var(--radius); color: var(--ink-2); }
    article blockquote p { margin: 0; }
    article hr { border: 0; border-top: 1px solid var(--rule); margin: 28px 0 10px; }
    .meta { color: var(--muted); }
    @media (max-width: 700px) { article { margin: 0; border-radius: 0; padding: 18px; } }
    @media print { header.bar { display: none; } article { border: 0; margin: 0; max-width: none; } }
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand"><b><a href="./">A9 PPFE</a></b><small>Fact sheet</small></div>
    <span class="spacer"></span>
    <a class="ghost" href="./" style="border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 10px">← Back to portal</a>
    <button class="ghost" onclick="print()">Print / PDF</button>
  </header>
  <article id="doc"><p class="meta">Loading fact sheet…</p></article>
  <script>
    (async () => {
      const el = document.getElementById("doc");
      try {
        const r = await fetch("FACT_SHEET.md", { cache: "no-cache" });
        if (!r.ok) throw new Error(r.status + " " + r.statusText);
        const md = (await r.text()).replace(/^> Blocks marked `AUTO`.*$/m, "");
        el.innerHTML = marked.parse(md);
        const v = md.match(/\*\*Version ([\d.]+)\*\*/);
        if (v) document.title = "A9 PPFE Fact Sheet v" + v[1];
        el.querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
      } catch (e) {
        el.innerHTML = '<p class="meta">Could not load FACT_SHEET.md (' + e.message + ').</p>';
      }
    })();
  </script>
</body>
</html>
